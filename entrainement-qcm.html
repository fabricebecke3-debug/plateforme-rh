<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entraînement RH : QCM</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f6f8;color:#1a1a1a;margin:0;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;max-width:680px;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 8px}
.muted{color:#5b6472;font-size:13px}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #cfd5df;background:#fff;cursor:pointer;margin:4px 0}
button.primary{background:#1f5fbf;color:#fff;border-color:#1f5fbf}
button:disabled{opacity:.6;cursor:default}
.choix{display:block;width:100%;text-align:left}
.bon{background:#e7f6ec!important;border-color:#1f9d55!important}
.faux{background:#fdecec!important;border-color:#c0392b!important}
.expl{background:#f1f5fb;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.barre{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>
<div class="card">
  <h1>Entraînement RH : QCM</h1>
  <p class="muted">Choisissez un thème, répondez, puis écoutez l'explication (🔊). Les textes juridiques se vérifient toujours auprès du Code du travail.</p>
  <div class="barre">
    <label>Thème <select id="theme"></select></label>
    <button id="start" class="primary">Commencer</button>
  </div>
  <div id="zone"></div>
</div>
<script>
const QUESTIONS = [
  {"id":"anc-1","theme":"Ancienneté","niveau":"base","question":"Un salarié est entré le 15 janvier 2020. Au 15 janvier 2026, quelle est son ancienneté ?","choix":["5 ans","6 ans","6 ans et 1 mois","7 ans"],"reponse":1,"explication":"Du 15 janvier 2020 au 15 janvier 2026, cela fait exactement 6 ans. L'ancienneté se calcule à partir de la date d'entrée, en années, mois et jours."},
  {"id":"anc-2","theme":"Ancienneté","niveau":"base","question":"Pour calculer l'ancienneté entre le 31 mars et le 30 avril, quelle méthode évite une erreur ?","choix":["Soustraire les jours sans rien ajuster","Emprunter les jours du mois précédent lorsque le jour de fin est plus petit que le jour de début","Compter 30 jours par mois fixe","Ignorer les jours restants"],"reponse":1,"explication":"Le 30 est plus petit que le 31 : on emprunte les jours du mois précédent. Le résultat exact est 30 jours."},
  {"id":"heu-1","theme":"Heures supplémentaires","niveau":"base","question":"Quel est le taux horaire d'un salaire de base de 173 330 FCFA pour 173,33 heures par mois ?","choix":["900 FCFA","1 000 FCFA","1 200 FCFA","1 730 FCFA"],"reponse":1,"explication":"Taux horaire = salaire / heures mensuelles = 173 330 / 173,33 = 1 000 FCFA."},
  {"id":"heu-2","theme":"Heures supplémentaires","niveau":"intermediaire","question":"Un salarié à 1 000 FCFA de l'heure fait 8 heures supplémentaires à 120 %. Quel est le montant ?","choix":["8 000 FCFA","9 600 FCFA","12 000 FCFA","9 000 FCFA"],"reponse":1,"explication":"8 x 1 000 x 1,20 = 9 600 FCFA. Le taux de majoration s'applique au taux horaire de base."},
  {"id":"heu-3","theme":"Heures supplémentaires","niveau":"intermediaire","question":"Un salarié fait 10 heures supplémentaires de jour : 8 à 120 % puis 2 à 150 %, pour un taux de base de 1 000 FCFA. Quel est le total ?","choix":["10 000 FCFA","12 600 FCFA","13 000 FCFA","15 000 FCFA"],"reponse":1,"explication":"8 x 1 000 x 1,20 = 9 600 ; 2 x 1 000 x 1,50 = 3 000 ; total 12 600 FCFA. Les taux utilisés sont des paramètres à vérifier avec le Code du travail."},
  {"id":"heu-4","theme":"Heures supplémentaires","niveau":"base","question":"Qu'est-ce qu'une majoration d'heures supplémentaires ?","choix":["Une réduction du salaire horaire","Un supplément appliqué au taux horaire pour les heures au-delà de la durée légale ou conventionnelle","Une prime de fin d'année","Une retenue sur les congés"],"reponse":1,"explication":"La majoration est un supplément qui s'ajoute au taux horaire pour les heures effectuées au-delà de la durée de travail applicable."},
  {"id":"con-1","theme":"Congés payés","niveau":"base","question":"Un salarié a 52,5 jours acquis et en a pris 10. Quel est son solde ?","choix":["62,5 jours","42,5 jours","52,5 jours","10 jours"],"reponse":1,"explication":"Solde = acquis - pris = 52,5 - 10 = 42,5 jours."},
  {"id":"con-2","theme":"Congés payés","niveau":"intermediaire","question":"Avec 2,5 jours acquis par mois de présence, combien de jours un salarié a-t-il acquis après 21 mois complets ?","choix":["21 jours","42 jours","52,5 jours","63 jours"],"reponse":2,"explication":"21 x 2,5 = 52,5 jours. Le nombre de jours par mois est un paramètre à vérifier avec le Code du travail et la convention."},
  {"id":"con-3","theme":"Congés payés","niveau":"base","question":"Quelle est la différence entre jours ouvrables et jours ouvrés ?","choix":["Il n'y a aucune différence","Les jours ouvrables incluent en général le samedi, les jours ouvrés ne le comptent pas","Les jours ouvrés incluent les dimanches","Les jours ouvrables sont les jours fériés"],"reponse":1,"explication":"Les jours ouvrables incluent en général le samedi ; les jours ouvrés non. Vérifiez la convention applicable, car la définition change selon les textes."},
  {"id":"pai-1","theme":"Paie","niveau":"base","question":"Un salarié travaille 15 jours sur une base de 30 jours. Son salaire de base est 300 000 FCFA. Quel est le salaire proratisé ?","choix":["100 000 FCFA","150 000 FCFA","200 000 FCFA","300 000 FCFA"],"reponse":1,"explication":"300 000 x 15 / 30 = 150 000 FCFA."},
  {"id":"pai-2","theme":"Paie","niveau":"base","question":"Quelle est la différence entre salaire brut et salaire net ?","choix":["Le net est toujours supérieur au brut","Le net est le brut diminué des cotisations et retenues salariales","Le brut ne contient pas les primes","Il n'y a pas de différence"],"reponse":1,"explication":"Le salaire brut est le montant avant retenues ; le net est le montant versé, après retenues salariales."},
  {"id":"pai-3","theme":"Paie","niveau":"intermediaire","question":"Quelle déclaration sociale concerne la Caisse nationale de prévoyance sociale (CNPS) au Cameroun ?","choix":["La déclaration mensuelle des cotisations sociales","La déclaration de TVA","La déclaration des bénéfices","La déclaration d'importation"],"reponse":0,"explication":"La CNPS reçoit les déclarations et cotisations sociales des employeurs et des salariés. Les modalités et taux se vérifient auprès de la CNPS."},
  {"id":"con-4","theme":"Contrats","niveau":"base","question":"Quelle est la principale différence entre un CDI et un CDD ?","choix":["Le CDI n'a pas de période d'essai","Le CDD a une durée définie à l'avance, le CDI est à durée indéterminée","Le CDD ne donne droit à aucun congé","Il n'y a pas de différence"],"reponse":1,"explication":"Le CDD a un terme fixé ; le CDI n'a pas de terme. Les conditions de recours et de renouvellement du CDD sont encadrées par le Code du travail."},
  {"id":"con-5","theme":"Contrats","niveau":"intermediaire","question":"Qu'est-ce qu'une reconduction tacite ?","choix":["Une signature écrite obligatoire","La poursuite du contrat sans nouvel écrit, lorsque le salarié continue de travailler après le terme","Un licenciement automatique","Une prime de renouvellement"],"reponse":1,"explication":"La reconduction tacite prolonge le contrat sans nouvel écrit. Ses conditions et ses limites dépendent du type de contrat : à vérifier avec le Code du travail."},
  {"id":"ess-1","theme":"Période d'essai","niveau":"base","question":"Pourquoi faut-il suivre la date de fin de période d'essai ?","choix":["Pour fixer le salaire","Pour décider à temps de confirmer ou de rompre la relation de travail","Pour calculer les congés","Ce n'est pas nécessaire"],"reponse":1,"explication":"Une décision prise après l'échéance peut poser problème. Le suivi permet de confirmer ou de rompre dans les délais."},
  {"id":"doc-1","theme":"Documents RH","niveau":"base","question":"Quels documents doivent être présents dans le dossier de sortie d'un salarié ?","choix":["Aucun document","Certificat de travail, attestation de fin de contrat (CNPS), solde de tout compte, dernier bulletin","Seulement la lettre de démission","Uniquement le contrat de travail"],"reponse":1,"explication":"Ces documents sont en général requis à la fin du contrat. La liste exacte dépend du motif de rupture : à vérifier."},
  {"id":"rgpd-1","theme":"Protection des données","niveau":"base","question":"Qui peut consulter les pièces d'identité des salariés ?","choix":["Tout collègue","Seulement les personnes habilitées, pour une finalité précise","Tout le monde sur l'intranet","Le client de la société"],"reponse":1,"explication":"Les données sensibles ne sont accessibles qu'aux personnes habilitées, pour une finalité précise, et seulement le temps nécessaire."},
  {"id":"rgpd-2","theme":"Protection des données","niveau":"intermediaire","question":"Combien de temps conserver le journal des modifications ?","choix":["Indéfiniment","Une durée définie et justifiée, validée juridiquement","Une semaine","Il ne faut pas en garder"],"reponse":1,"explication":"Une durée de conservation doit être définie et justifiée. Dans la plateforme, elle est configurable et doit être validée par un juriste."},
  {"id":"ia-1","theme":"Assistant IA","niveau":"base","question":"Un assistant IA donne une réponse juridique précise. Que faites-vous ?","choix":["Je l'applique sans vérifier","Je vérifie le texte officiel ou la convention avant d'agir","Je demande à un collègue au hasard","Je l'ignore"],"reponse":1,"explication":"Une réponse d'IA est une aide. Pour le droit, le texte officiel et un juriste font foi."},
  {"id":"exc-1","theme":"Excel et Power BI","niveau":"base","question":"Dans Excel, quelle fonction permet de rechercher une valeur dans une colonne à partir d'une clé ?","choix":["RECHERCHEV","SOMME","MOYENNE","TEXTE"],"reponse":0,"explication":"RECHERCHEV (ou XLOOKUP selon la version) recherche une clé dans la première colonne d'une plage et renvoie une valeur de la même ligne."},
  {"id":"exc-2","theme":"Excel et Power BI","niveau":"intermediaire","question":"Quel outil de Power BI sert à transformer et nettoyer les données avant l'analyse ?","choix":["Power Query","Power Pivot","Power Apps","Power Automate"],"reponse":0,"explication":"Power Query prépare les données (nettoyage, fusion, transformation) avant leur utilisation dans les rapports."}
]
;
let liste=[], idx=0, score=0, erreurs=[];
const $=id=>document.getElementById(id);
function voix(texte){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(texte); u.lang='fr-FR'; speechSynthesis.speak(u);
}
const themes=['Tous',...new Set(QUESTIONS.map(q=>q.theme))];
$('theme').innerHTML=themes.map(t=>'<option>'+t+'</option>').join('');
function commencer(liste_){ liste=liste_; idx=0; score=0; erreurs=[]; montrer(); }
$('start').onclick=()=>{
  const t=$('theme').value;
  const base=QUESTIONS.filter(q=>t==='Tous'||q.theme===t);
  commencer(base.slice().sort(()=>Math.random()-0.5));
};
function montrer(){
  if(idx>=liste.length){ return fin(); }
  const q=liste[idx];
  $('zone').innerHTML='<p class="muted">Question '+(idx+1)+' / '+liste.length+' — '+q.theme+' ('+q.niveau+')</p>'
    +'<p style="font-size:16px"><b>'+q.question+'</b></p>'
    +q.choix.map((c,i)=>'<button class="choix" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+c+'</button>').join('')
    +'<div id="fb"></div>';
  document.querySelectorAll('.choix').forEach(b=>b.onclick=()=>repondre(Number(b.dataset.i)));
}
function repondre(i){
  const q=liste[idx];
  const ok=i===q.reponse;
  if(ok) score++; else erreurs.push(q);
  document.querySelectorAll('.choix').forEach((b,k)=>{
    b.disabled=true;
    if(k===q.reponse) b.classList.add('bon');
    else if(k===i) b.classList.add('faux');
  });
  $('fb').innerHTML='<p><b>'+(ok?'Bonne réponse !':'Pas tout à fait.')+'</b></p>'
    +'<div class="expl">'+q.explication+'</div>'
    +'<div class="barre"><button id="ecoute">🔊 Écouter l’explication</button>'
    +'<button class="primary" id="suite">Question suivante</button></div>';
  $('ecoute').onclick=()=>voix((ok?'Bonne réponse. ':'Ce n’est pas la bonne réponse. ')+q.explication);
  $('suite').onclick=()=>{ idx++; montrer(); };
}
function fin(){
  const pct=liste.length?Math.round(score/liste.length*100):0;
  $('zone').innerHTML='<h2>Résultat : '+score+' / '+liste.length+' ('+pct+' %)</h2>'
    +(erreurs.length?'<p>À revoir :</p><ul>'+erreurs.map(q=>'<li>'+q.question+'</li>').join('')+'</ul>'
      +'<button class="primary" id="revoir">Revoir les erreurs</button>':'<p>Excellent, aucune erreur.</p>')
    +'<button id="rejouer">Recommencer</button>';
  $('rejouer').onclick=()=>$('start').click();
  if($('revoir')) $('revoir').onclick=()=>commencer(erreurs.slice());
}
</script></body></html>
